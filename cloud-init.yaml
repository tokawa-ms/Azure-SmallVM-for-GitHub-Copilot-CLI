#cloud-config
package_update: true
package_upgrade: false

packages:
  - bat
  - build-essential
  - ca-certificates
  - curl
  - fzf
  - git
  - jq
  - language-pack-ja
  - locales
  - python3
  - python3-pip
  - python3-venv
  - ripgrep
  - tig
  - tmux
  - unzip
  - zip
  - zoxide
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting

write_files:
  - path: /etc/profile.d/prefer-zsh.sh
    permissions: "0644"
    defer: true
    content: |
      if [ -n "${BASH_VERSION:-}" ] && [ -t 0 ] && [ -t 1 ] &&
         [ -x /usr/bin/zsh ] && [ ! -e "${HOME}/.disable-auto-zsh" ]; then
        exec /usr/bin/zsh -l
      fi
  - path: /etc/zsh/zshrc
    permissions: "0644"
    defer: true
    content: |
      export ZSH=/opt/oh-my-zsh
      ZSH_THEME="agnoster"
      plugins=(git sudo extract colored-man-pages command-not-found)
      DISABLE_AUTO_UPDATE="true"
      DISABLE_UPDATE_PROMPT="true"
      source "${ZSH}/oh-my-zsh.sh"

      HISTFILE="${ZDOTDIR:-${HOME}}/.zsh_history"
      HISTSIZE=50000
      SAVEHIST=50000
      setopt EXTENDED_HISTORY
      setopt APPEND_HISTORY
      setopt INC_APPEND_HISTORY
      setopt HIST_IGNORE_ALL_DUPS
      setopt HIST_REDUCE_BLANKS
      setopt HIST_VERIFY

      if command -v fzf >/dev/null 2>&1; then
        [ -r /usr/share/doc/fzf/examples/key-bindings.zsh ] &&
          source /usr/share/doc/fzf/examples/key-bindings.zsh
        [ -r /usr/share/doc/fzf/examples/completion.zsh ] &&
          source /usr/share/doc/fzf/examples/completion.zsh
      fi
      command -v zoxide >/dev/null 2>&1 && eval "$(zoxide init zsh)"
      [ -r /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh ] &&
        source /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh

      alias g="git"
      alias gst="git status --short --branch"
      alias gl="git log --graph --decorate --oneline --all"
      alias t="tig"
      alias ta="tmux attach -t"
      alias tls="tmux list-sessions"
      alias cpl="copilot"
      alias ll="ls -alF"
      command -v batcat >/dev/null 2>&1 && alias bat="batcat"

      # Syntax highlighting must be sourced after all other zsh plugins.
      [ -r /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh ] &&
        source /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
  - path: /etc/motd
    permissions: "0644"
    content: |
      GitHub Copilot CLI VM

      Check provisioning:
        cloud-init status --wait
        cat /var/log/copilot-vm-init.log

      Authenticate:
        copilot login

      Start a durable session:
        tmux new -s copilot
        copilot

runcmd:
  - [bash, -lc, "install -m 0644 /dev/null /var/log/copilot-vm-init.log"]
  - [bash, -lc, "set -o pipefail; locale-gen ja_JP.UTF-8 2>&1 | tee -a /var/log/copilot-vm-init.log"]
  - [bash, -lc, "update-locale LANG=ja_JP.UTF-8 LC_CTYPE=ja_JP.UTF-8"]
  - [bash, -lc, "set -o pipefail; git clone --filter=blob:none https://github.com/ohmyzsh/ohmyzsh.git /opt/oh-my-zsh 2>&1 | tee -a /var/log/copilot-vm-init.log"]
  - [bash, -lc, "set -o pipefail; git -C /opt/oh-my-zsh checkout --detach d42209f2afa8ec3e6971e5b4695ff27f9d5670d2 2>&1 | tee -a /var/log/copilot-vm-init.log"]
  - [bash, -lc, "test \"$(git -C /opt/oh-my-zsh rev-parse HEAD)\" = d42209f2afa8ec3e6971e5b4695ff27f9d5670d2"]
  - [bash, -lc, "set -o pipefail; curl -fsSL https://gh.io/copilot-install | bash 2>&1 | tee -a /var/log/copilot-vm-init.log"]
  - [bash, -lc, "copilot --version 2>&1 | tee -a /var/log/copilot-vm-init.log"]
  - [bash, -lc, "date --iso-8601=seconds | tee /var/lib/cloud/instance/copilot-vm-ready"]

final_message: "GitHub Copilot CLI VM initialization completed after $UPTIME seconds."
